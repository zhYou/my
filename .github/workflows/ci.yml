name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    runs-on: ubuntu-latest
    env: &isolated-env
      CI_CACHE_ROOT: ${{ github.workspace }}/../.ci
      MY_HOME: ${{ github.workspace }}/../.ci/my-home
      npm_config_cache: ${{ github.workspace }}/../.ci/tool-cache/npm
      UV_CACHE_DIR: ${{ github.workspace }}/../.ci/tool-cache/uv
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/../.ci/tool-cache/python
      UV_TOOL_DIR: ${{ github.workspace }}/../.ci/tool-cache/uv-tools
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: go golangci-lint actionlint goreleaser node python uv
      - &go-env
        name: 读取 Go 缓存路径
        id: go-env
        shell: bash
        run: |
          {
            printf 'version=%s\n' "$(mise exec -- go env GOVERSION)"
            printf 'modules=%s\n' "$(mise exec -- go env GOMODCACHE)"
            printf 'build=%s\n' "$(mise exec -- go env GOCACHE)"
          } >> "$GITHUB_OUTPUT"
      - &module-cache
        name: 缓存 Go 模块
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-env.outputs.modules }}
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-env.outputs.version }}-${{ hashFiles('go.mod', 'go.sum') }}
      - &build-cache
        name: 缓存 Go 编译结果
        if: ${{ runner.os != 'Windows' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-env.outputs.build }}
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-env.outputs.version }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-env.outputs.version }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml') }}-
            gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-env.outputs.version }}-${{ github.job }}-
      - name: 缓存静态检查结果
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/golangci-lint-cache
          key: lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.mod', 'go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.mod', 'go.sum', '.golangci.yml') }}-
      - &go-deps
        name: 下载 Go 模块
        run: mise exec -- go mod download
      - &text-tool-cache
        name: 缓存外部 npx、uvx 和独立 Python
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CI_CACHE_ROOT }}/tool-cache
          key: tool-cache-text-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}
      - name: 原生进程树、取消与资源所有权验收
        env:
          MY_HOME: ${{ runner.temp }}/native-command-home
        run: mise exec -- go test -count=1 -timeout=90s ./internal/command -run 'Test(Windows|OwnedDescendants|RootExits|CleanupDoes|CancellationRetains|TerminateProcessGroup)'
      - run: mise run check
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint-cache
      - name: 比较事件基准的机器契约
        env:
          CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$CONTRACT_BASE" ] && [ "$CONTRACT_BASE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$CONTRACT_BASE"
            mise run contract:check -- --against "$CONTRACT_BASE"
          fi
  race:
    runs-on: ubuntu-latest
    env: *isolated-env
    steps:
      - *checkout
      - &mise-tests
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: go node python uv
      - *go-env
      - *module-cache
      - *build-cache
      - *text-tool-cache
      - *go-deps
      - run: mise exec -- go test -race ./...
  fuzz-benchmark:
    runs-on: ubuntu-latest
    env: *isolated-env
    steps:
      - *checkout
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: go
      - *go-env
      - *module-cache
      - *build-cache
      - *go-deps
      - run: mise exec -- go test ./internal/app/cli -run=^$ -fuzz=FuzzArgv -fuzztime=5s
      - run: mise exec -- go test ./internal/app/cli -run=^$ -bench=. -benchmem
  package:
    runs-on: ubuntu-latest
    env: *isolated-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: go goreleaser syft
      - *go-env
      - *module-cache
      - *build-cache
      - *go-deps
      - run: mise exec -- goreleaser release --snapshot --clean --parallelism 2
      - run: mise run release:verify
  agent-mcp:
    env: *isolated-env
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: go node uv taplo go:golang.org/x/tools/gopls
      - *go-env
      - *module-cache
      - *build-cache
      - name: 缓存 Serena、Graphify 与独立 Python
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CI_CACHE_ROOT }}/tool-cache
          key: tool-cache-agent-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}
      - *go-deps
      - run: mise run mcp:check
  agent-mcp-platforms:
    if: ${{ github.event_name != 'pull_request' }}
    env: *isolated-env
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: go node uv taplo go:golang.org/x/tools/gopls
      - *go-env
      - *module-cache
      - *build-cache
      - name: 缓存 Serena、Graphify 与独立 Python
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CI_CACHE_ROOT }}/tool-cache
          key: tool-cache-agent-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}
      - *go-deps
      - run: mise run mcp:check
  platform-tests:
    env: *isolated-env
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *mise-tests
      - *go-env
      - *module-cache
      - *build-cache
      - *text-tool-cache
      - *go-deps
      - name: PR 原生命令、模板与二进制测试
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          mise exec -- go test -count=1 -timeout=90s ./internal/command -run 'Test(Windows|OwnedDescendants|RootExits|CleanupDoes|CancellationRetains|TerminateProcessGroup)'
          mise exec -- go test -count=1 ./tools/template -run '^TestTemplateExecutable(Path|Acceptance)$'
          mise exec -- go test -count=1 ./test/integration
      - name: 非 PR 全量测试
        if: ${{ github.event_name != 'pull_request' }}
        run: mise exec -- go test ./...
  platforms:
    env: *isolated-env
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: go go:golang.org/x/tools/gopls go:golang.org/x/vuln/cmd/govulncheck golangci-lint actionlint goreleaser syft node python uv taplo
      - *go-env
      - *module-cache
      - *build-cache
      - *text-tool-cache
      - *go-deps
      - run: mise run doctor
      - run: mise run lint:text
      - run: mise run build
  check:
    if: ${{ always() }}
    needs: [source, race, fuzz-benchmark, package, agent-mcp, agent-mcp-platforms, platform-tests, platforms]
    runs-on: ubuntu-latest
    steps:
      - name: 汇总全部 CI 检查
        shell: bash
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS_RESULTS"
          jq -e 'length > 0 and all(to_entries[]; .value.result == "success" or (.key == "agent-mcp-platforms" and .value.result == "skipped"))' <<< "$NEEDS_RESULTS" > /dev/null
